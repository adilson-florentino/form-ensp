<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Huawei eNSP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }
        .content {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        .required::after {
            content: " *";
            color: #e74c3c;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .lgpd-notice {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            font-size: 12px;
            color: #666;
        }
        .checkbox-group {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }
        .checkbox-group input {
            width: 18px;
            margin-top: 2px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 14px;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.5s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📥 Huawei eNSP</h1>
            <p>Emulador para VirtualBox</p>
        </div>
        <div class="content">
            <form id="form">
                <div class="form-group">
                    <label class="required">Nome completo</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="form-group">
                    <label class="required">E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label class="required">Empresa</label>
                    <input type="text" id="empresa" required>
                </div>
                <div class="form-group">
                    <label class="required">Cargo</label>
                    <input type="text" id="cargo" required>
                </div>
                <div class="lgpd-notice">
                    <strong>🔒 LGPD</strong><br>
                    Seus dados serão usados para liberar o download e enviar informações sobre cursos e eventos. Você pode cancelar a qualquer momento.
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="consentimento" required>
                    <label>Concordo com o aviso de privacidade</label>
                </div>
                <button type="submit">📥 Cadastrar e Baixar</button>
            </form>
            <div id="message"></div>
        </div>
    </div>

    <script>
        // ⚠️ COLE A URL DO SEU WEBHOOK AQUI ⚠️
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxE5GVvolcsl5nfwtunPEwMt2zgeNMx-c5quSikyP_5XbQ_QchoSXT8GsWTxB436uuI/exec';
        
        // Link do Google Drive
        const DOWNLOAD_URL = 'https://drive.google.com/uc?export=download&id=1uuwQlc8-kFiXSovNb_Sgaq3XjEJ0t4vz';
        
        const form = document.getElementById('form');
        const messageDiv = document.getElementById('message');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const empresa = document.getElementById('empresa').value.trim();
            const cargo = document.getElementById('cargo').value.trim();
            const consentimento = document.getElementById('consentimento').checked;
            
            if (!nome || !email || !empresa || !cargo) {
                showMessage('Preencha todos os campos', 'error');
                return;
            }
            
            if (!consentimento) {
                showMessage('Você precisa aceitar a LGPD', 'error');
                return;
            }
            
            // Desabilitar botão
            const btn = document.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> Enviando...';
            btn.disabled = true;
            
            // Enviar dados
            const dados = { nome, email, empresa, cargo, consentimento };
            
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                
                showMessage('✅ Cadastro realizado! Iniciando download...', 'success');
                
                // Iniciar download
                setTimeout(() => {
                    window.open(DOWNLOAD_URL, '_blank');
                    showMessage('📥 Se o download não iniciar, <a href="' + DOWNLOAD_URL + '" target="_blank">clique aqui</a>', 'success');
                }, 1000);
                
                form.reset();
                
            } catch (error) {
                console.error('Erro:', error);
                showMessage('⚠️ Erro ao cadastrar, mas o download foi liberado.', 'success');
                setTimeout(() => {
                    window.open(DOWNLOAD_URL, '_blank');
                }, 1000);
            } finally {
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 3000);
            }
        });
        
        function showMessage(msg, type) {
            messageDiv.innerHTML = msg;
            messageDiv.className = 'message ' + type;
            setTimeout(() => {
                messageDiv.style.display = 'none';
                messageDiv.className = 'message';
            }, 8000);
        }
        
        console.log('✅ Formulário pronto!');
        console.log('Webhook:', WEBHOOK_URL);
        console.log('Download:', DOWNLOAD_URL);
    </script>
</body>
</html>
